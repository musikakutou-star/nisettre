name: 💡 新規実装
description: 機能追加のテンプレート
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        ## 新規機能追加 Issue
        Laravelで新しい機能を追加する際のタスク管理用テンプレートです。

  - type: input
    id: feature_name
    attributes:
      label: 機能名
      placeholder: 例）ユーザーお気に入り機能

  - type: textarea
    id: description
    attributes:
      label: 概要
      description: 実装する機能の概要を記載してください

  - type: checkboxes
    id: laravel_files
    attributes:
      label: 作成・変更が必要なファイル
      description: 必要なものにチェックを入れてください
      options:
        - label: Controller 作成
        - label: Model 作成
        - label: View (Blade) 作成
        - label: Migration 作成
        - label: Route 追加 (routes/web.php)
        - label: Request クラス作成 (FormRequest)
        - label: Validation 追加
        - label: Service / Repository 作成
        - label: Seeder / Factory 作成
        - label: Test 作成 (Feature / Unit)

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 実装メモや仕様など